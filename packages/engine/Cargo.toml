[package]
name = "throughline-engine"
version = "0.1.0"
edition = "2021"
description = "Throughline engine: campus routing, itinerary solver, scheduler, simulation. Pure, deterministic, WASM-ready."
license = "MIT"
repository = "https://github.com/hungtruongOwolf/throughline"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Seeded ChaCha8 without OS entropy, so it builds for wasm32-unknown-unknown.
rand_core = { version = "0.6", default-features = false }
rand_chacha = { version = "0.3", default-features = false }

[profile.release]
opt-level = "s"
lto = true

[dev-dependencies]
proptest = "1"
